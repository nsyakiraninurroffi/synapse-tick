name: ticketflow_mobile
description: "TicketFlow Gate Scanner & Vendor Booth App - Offline-First Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.2.1
  dio: ^5.4.3

  # Local Database (SQLite) - Offline First
  sqflite: ^2.3.2
  path: ^1.9.0

  # QR Code Scanning
  mobile_scanner: ^5.0.0

  # QR Code Display
  qr_flutter: ^4.1.0

  # State Management
  provider: ^6.1.2

  # Secure Storage (JWT Token)
  flutter_secure_storage: ^9.2.2

  # Encryption (AES-256)
  encrypt: ^5.0.3

  # NFC
  nfc_manager: ^3.3.0

  # Shared Preferences
  shared_preferences: ^2.2.3

  # Icons
  cupertino_icons: ^1.0.6

  # UI / Animations
  lottie: ^3.1.2
  shimmer: ^3.0.0

  # Connectivity
  connectivity_plus: ^6.0.3

  # Date formatting
  intl: ^0.19.0

  # UUID
  uuid: ^4.4.0

  # Crypto
  crypto: ^3.0.3

  # ======================================================
  # NEW: Social Login & UI Additions (Phase 2)
  # ======================================================

  # Google Sign-In (Social Login)
  # Requires: configure OAuth Client ID in google-services.json (Android)
  # and GoogleService-Info.plist (iOS)
  google_sign_in: ^6.2.1

  # Font Awesome Flutter Icons (TikTok icon, etc.)
  font_awesome_flutter: ^10.7.0

  # URL Launcher (for Google Calendar links)
  url_launcher: ^6.3.0

  # Google Maps Flutter
  # Requires: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY in AndroidManifest & Info.plist
  google_maps_flutter: ^2.9.0

  # Cached Network Images (for event images)
  cached_network_image: ^3.4.1

  # Glassmorphism-style blur effect
  flutter_acrylic: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
